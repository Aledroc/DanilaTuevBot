<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Leather Lumberjack • Лесоруб Билли — Mini App</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050811;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 30%, #0d172e 0%, #070b16 70%, #020409 100%);
    }
    canvas {
      display: block;
      touch-action: none;
      box-shadow: 0 0 45px rgba(0, 229, 255, 0.2), 0 0 30px rgba(0,0,0,0.8);
    }
    /* Сенсорные зоны тапа */
    .touch-overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 28px;
      pointer-events: auto;
    }
    .touch-left {
      left: 0;
    }
    .touch-right {
      right: 0;
    }
    .tap-hint {
      background: rgba(13, 22, 40, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #00e5ff;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border: 1px solid rgba(0, 229, 255, 0.35);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 10px rgba(0, 229, 255, 0.2);
      pointer-events: none;
      transition: all 0.2s;
    }
    .touch-overlay:active .tap-hint {
      transform: scale(0.94);
      background: rgba(0, 229, 255, 0.25);
      color: #fff;
    }
    /* Верхняя плашка для закрытия / возврата */
    .top-controls {
      position: absolute;
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }
    .control-btn {
      pointer-events: auto;
      background: rgba(13, 20, 36, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 229, 255, 0.35);
      color: #00e5ff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 10px rgba(0, 229, 255, 0.15);
      transition: all 0.15s;
    }
    .control-btn:active {
      transform: scale(0.96);
      background: rgba(0, 229, 255, 0.2);
    }
    /* Кнопка рестарта при Game Over */
    #restart-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, 65%);
      z-index: 30;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }
    #btn-restart {
      background: linear-gradient(135deg, #00e5ff 0%, #0077b6 100%);
      color: #060913;
      border: 2px solid rgba(255, 255, 255, 0.6);
      padding: 16px 36px;
      font-size: 18px;
      font-weight: 900;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.6), 0 8px 20px rgba(0, 0, 0, 0.6);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-restart:active {
      transform: scale(0.96);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
    }
    .restart-subtext {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="top-controls">
      <button class="control-btn" id="btn-back">← Назад в меню</button>
      <button class="control-btn" id="btn-mute">🔊 Звук: Вкл</button>
    </div>
    <canvas id="game-canvas" width="1080" height="1775"></canvas>
    <div class="touch-overlay touch-left" id="touch-left">
      <span class="tap-hint" id="hint-left">⚡ Руби СЛЕВА 🪓</span>
    </div>
    <div class="touch-overlay touch-right" id="touch-right">
      <span class="tap-hint" id="hint-right">🪓 Руби СПРАВА ⚡</span>
    </div>
    <div id="restart-container">
      <button id="btn-restart">💪 ASS WE CAN (ЗАНОВО)</button>
      <div class="restart-subtext">или нажми в любое место, boy!</div>
    </div>
  </div>
  <script src="/games/timberman/game.js?v=1794772672"></script>

  <script>
    // Responsive Canvas Viewport Adapter for Timberman (1080x1775)
    (function() {
      const BASE_W = 1080;
      const BASE_H = 1775;
      const canvas = document.getElementById('game-canvas');
      const container = document.getElementById('game-container');
      if (!canvas || !container) return;

      function resizeViewport() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const scale = Math.min(vw / BASE_W, vh / BASE_H);
        const renderW = Math.round(BASE_W * scale);
        const renderH = Math.round(BASE_H * scale);
        
        canvas.style.width = renderW + 'px';
        canvas.style.height = renderH + 'px';
        canvas.style.maxWidth = 'none';
        canvas.style.maxHeight = 'none';
        canvas.style.flexShrink = '0';
      }

      window.addEventListener('resize', resizeViewport);
      window.addEventListener('orientationchange', () => setTimeout(resizeViewport, 150));
      document.addEventListener('DOMContentLoaded', resizeViewport);
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        resizeViewport();
      }
    })();
  </script>

</body>
</html>
