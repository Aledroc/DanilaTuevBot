<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rainbow Dungeon — Цветной флекс</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080a10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 30%, #151928 0%, #06080e 90%);
      touch-action: none;
    }
    canvas {
      display: block;
      touch-action: none;
      box-shadow: 0 0 35px rgba(0,0,0,0.85);
    }
    .top-controls {
      position: absolute;
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }
    .control-btn {
      pointer-events: auto;
      background: rgba(18, 23, 34, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 215, 0, 0.35);
      color: #ffd700;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5), 0 0 10px rgba(255,215,0,0.15);
      transition: transform 0.1s, background 0.15s, border-color 0.15s;
    }
    .control-btn:active {
      transform: scale(0.95);
      background: rgba(45, 53, 67, 0.95);
      border-color: #00f0ff;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="top-controls">
      <button class="control-btn" id="btn-back">← Меню</button>
      <button class="control-btn" id="btn-mute">🔊 Звук: Вкл</button>
    </div>
    <canvas id="game-canvas" width="720" height="1280"></canvas>
  </div>
  <script src="/games/colorswitch/game.js?v=20261116_v2"></script>

  <script>
    // Responsive Canvas Viewport Adapter
    (function() {
      const BASE_W = 720;
      const BASE_H = 1280;
      const canvas = document.getElementById('game-canvas');
      const container = document.getElementById('game-container');
      if (!canvas || !container) return;

      function resizeViewport() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        // На смартфонах вычисляем масштаб, чтобы игра заполняла экран максимально
        // Масштабируем по меньшей стороне с сохранением aspect ratio,
        // но с центрированием и touch-action: none.
        const scale = Math.min(vw / BASE_W, vh / BASE_H);
        const renderW = Math.round(BASE_W * scale);
        const renderH = Math.round(BASE_H * scale);
        
        canvas.style.width = renderW + 'px';
        canvas.style.height = renderH + 'px';
        canvas.style.maxWidth = 'none';
        canvas.style.maxHeight = 'none';
        canvas.style.flexShrink = '0';
      }

      window.addEventListener('resize', resizeViewport);
      window.addEventListener('orientationchange', () => setTimeout(resizeViewport, 150));
      document.addEventListener('DOMContentLoaded', resizeViewport);
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        resizeViewport();
      }
    })();
  </script>

</body>
</html>
